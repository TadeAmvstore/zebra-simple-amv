<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAmvStore · Prototipo</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark;background:#0d0e11;color:#f3f3f4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0%,#292b31,#0d0e11 58%);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid #444750;background:#292b31;color:#fff;border-radius:10px;padding:12px}button.primary{background:#f4f4f5;color:#161719;border-color:#f4f4f5;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
input,select{width:100%;background:#202126;border:1px solid #484950;color:white;border-radius:9px;padding:12px}label{display:block;color:#c5c6cc;font-size:.85rem;margin:13px 0 6px}
.card{background:#191b20;border:1px solid #34363d;border-radius:18px;padding:22px}.muted{color:#a9abb4}.logo{font-size:34px;font-weight:900;letter-spacing:-2px}.logo small{font-size:9px;letter-spacing:3px;display:block;font-weight:500}
#login{max-width:430px;margin:8vh auto;padding:20px}#login .card{margin-top:26px}h1{font-size:25px;margin:8px 0}h2{font-size:20px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid #33353a}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 87px)}nav{border-right:1px solid #33353a;padding:20px;display:flex;flex-direction:column;gap:9px}nav button{text-align:left;width:100%}main{padding:25px;max-width:1200px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.preview{background:#f8f8f8;color:#111;border-radius:10px;min-height:250px;display:grid;place-items:center;text-align:center}.badge{display:inline-block;border:1px solid #50535b;border-radius:20px;padding:4px 9px;font-size:12px}.hidden{display:none!important}.wide{width:100%;margin-top:15px}.stack{display:grid;gap:12px}.user{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #36383e;padding:13px 0}.user:last-child{border:0}.perms label{display:flex;gap:10px;align-items:center}.perms input{width:auto}
@media(max-width:700px){.layout{display:block}nav{border-right:0;border-bottom:1px solid #33353a;flex-direction:row;overflow-x:auto;padding:12px}nav button{white-space:nowrap;width:auto}main{padding:16px}header{padding:15px}#login{margin:3vh auto}}
</style></head><body>
<section id="login"><div style="text-align:center"><div class="logo">AMV<small>ELECTRO & BAZAR</small></div><p class="muted">Centro de Operaciones</p></div><div class="card"><h1>Iniciar sesión</h1><p class="muted">Demo local. No uses contraseñas reales.</p><label>Usuario</label><input id="login-user" value="admin"><label>Contraseña</label><input id="login-password" type="password" value="demo123"><button class="primary wide" id="login-button">Ingresar</button><p class="muted" id="login-error"></p><p class="muted">Pruebas: admin / operador01 / supervisor01 · clave demo123</p></div></section>
<section id="workspace" class="hidden"><header><div class="logo">AMV<small>ELECTRO & BAZAR</small></div><div><span id="who" class="muted"></span> <button id="logout">Salir</button></div></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div></section>
<script>
const defaults={admin:['print','history','users','printers'],supervisor:['print','history'],operador:['print']};
const accounts=[{name:'admin',password:'demo123',role:'admin',perms:[...defaults.admin],active:true},{name:'operador01',password:'demo123',role:'operador',perms:[...defaults.operador],active:true},{name:'supervisor01',password:'demo123',role:'supervisor',perms:[...defaults.supervisor],active:true}];
const labels={print:'Impresión Zebra',history:'Historial',users:'Usuarios',printers:'Impresoras'};
let current=null,screen='print';const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){const a=accounts.find(x=>x.name===$('login-user').value.trim()&&x.password===$('login-password').value&&x.active);if(!a){$('login-error').textContent='Credenciales incorrectas o cuenta bloqueada';return}current=a;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');screen='print';render()}
$('login-button').onclick=login;$('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logout').onclick=()=>{current=null;$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('login-error').textContent=''};
function render(){if(!current)return;$('who').textContent=current.name+' · '+current.role;$('nav').innerHTML='';for(const key of Object.keys(labels)){if(!current.perms.includes(key))continue;const b=document.createElement('button');b.textContent=labels[key];b.onclick=()=>{screen=key;render()};$('nav').append(b)}if(!current.perms.includes(screen))screen='print';const main=$('main');if(screen==='print'){main.innerHTML='<h1>Impresión Zebra</h1><p class="muted">Vista de prueba · sin conexión con impresoras</p><div class="grid"><div class="card"><h2>Archivos</h2><label>PDF o imagen</label><input type="file" id="files" accept=".pdf,.png,.jpg,.jpeg" multiple><p class="muted" id="files-info">Sin archivos</p><label>Impresora</label><select id="printer"><option>Zebra 1</option><option>Zebra 2</option><option>Zebra 3</option><option>Zebra 4</option></select><label>Modo</label><select id="mode"><option value="single">Individual</option><option value="batch">Por tandas (hasta 10 PDF)</option></select><label>Copias</label><input type="number" id="copies" value="1" min="1" max="999"><button class="primary wide" id="simulate">Simular impresión</button><p class="muted" id="result"></p></div><div class="card"><h2>Vista previa</h2><div class="preview"><div><h2>AMV</h2>Etiqueta de demostración<br><small>Sin vista previa real</small></div></div></div></div>';$('files').onchange=()=>{$('files-info').textContent=Array.from($('files').files).map(f=>f.name).join(', ')||'Sin archivos'};$('simulate').onclick=()=>{const fs=Array.from($('files').files);if(!fs.length){$('result').textContent='Seleccioná un archivo de prueba';return}if($('mode').value==='batch'&&(fs.length>10||fs.some(f=>!f.name.toLowerCase().endsWith('.pdf')))){$('result').textContent='La tanda admite hasta 10 PDF';return}$('result').textContent='Simulación: '+fs.length+' archivo(s) · '+$('printer').value+'. No se imprimió nada.'};}
else if(screen==='users'){main.innerHTML='<h1>Gestión de usuarios</h1><div class="grid"><div class="card"><h2>Crear usuario</h2><label>Usuario</label><input id="new-name"><label>Contraseña de prueba</label><input id="new-password" type="password"><label>Rol</label><select id="new-role"><option value="operador">Operador</option><option value="supervisor">Supervisor</option></select><div class="perms" id="permission-box"></div><button class="primary wide" id="add">Crear usuario</button><p class="muted" id="user-status"></p></div><div class="card"><h2>Cuentas de prueba</h2><div id="users-list"></div></div></div>';const role=$('new-role'),permbox=$('permission-box');function updatePerms(){permbox.innerHTML=Object.entries(labels).map(([k,v])=>'<label><input type="checkbox" value="'+k+'" '+(defaults[role.value].includes(k)?'checked':'')+'>'+v+'</label>').join('')}role.onchange=updatePerms;updatePerms();$('add').onclick=()=>{const name=$('new-name').value.trim(),password=$('new-password').value;if(!name||!password||accounts.some(a=>a.name===name)){$('user-status').textContent='Completá los datos y elegí un nombre disponible';return}accounts.push({name,password,role:role.value,perms:Array.from(permbox.querySelectorAll('input:checked')).map(x=>x.value),active:true});$('new-name').value='';$('new-password').value='';$('user-status').textContent='Cuenta ficticia creada';listUsers()};function listUsers(){$('users-list').innerHTML=accounts.map(a=>'<div class="user"><div><strong>'+escapeHtml(a.name)+'</strong><br><span class="muted">'+escapeHtml(a.role)+' · '+(a.active?'Activo':'Bloqueado')+'</span></div>'+(a.name==='admin'?'':'<button data-user="'+escapeHtml(a.name)+'">'+(a.active?'Bloquear':'Activar')+'</button>')+'</div>').join('');$('users-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=accounts.find(x=>x.name===b.dataset.user);if(a)a.active=!a.active;listUsers()})}listUsers();}
else if(screen==='history')main.innerHTML='<h1>Historial</h1><div class="card"><p class="muted">La versión real registrará usuario, archivo, impresora, fecha y resultado del envío. Esta demo no almacena operaciones.</p></div>';
else if(screen==='printers')main.innerHTML='<h1>Impresoras</h1><div class="card"><p class="muted">Configuración de Zebra 1, Zebra 2, Zebra 3 y Zebra 4. Demo sin acceso a la red.</p></div>'}
</script></body></html>
